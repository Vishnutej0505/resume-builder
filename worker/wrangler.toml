name = "resume-builder-ai-proxy"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Secrets (never in this file — set with `wrangler secret put <NAME>`):
#   GEMINI_API_KEY      — Gemini API key, called from src/index.js only
#   APP_SHARED_SECRET   — must match EXPO_PUBLIC_APP_SHARED_SECRET in the app's .env
#
# KV namespace for the daily spend cap (ARCHITECTURE.md Section 4.2).
# Create it once with `wrangler kv namespace create USAGE_KV`, then paste the
# returned id below and uncomment.
# [[kv_namespaces]]
# binding = "USAGE_KV"
# id = "<paste-id-here>"

# `wrangler dev` fails fast without a real KV binding. For local testing,
# create a dev-only namespace instead:
#   wrangler kv namespace create USAGE_KV --preview
# and add its id as `preview_id` on the binding above, or run
# `wrangler dev --local` which persists KV to disk automatically.
